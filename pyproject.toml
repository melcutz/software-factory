[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.3.0"
description = "Autonomous issue-to-merge software factory with pluggable coding agent backends (agy, optional OpenCode, optional local gpu:* decision gate) and Git-native coordination"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/melcutz/software-factory"
Repository = "https://github.com/melcutz/software-factory"
Issues = "https://github.com/melcutz/software-factory/issues"

[project.scripts]
factory = "factory.cli:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["agents/*.md", "config.json", "checks.sh"]
